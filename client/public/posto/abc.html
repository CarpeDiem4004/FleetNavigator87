<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecionando para Posto ABC - Murici On Fleet</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
    }
    .redirect-container {
      background-color: white;
      border-radius: 12px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
      padding: 2.5rem;
      text-align: center;
      max-width: 500px;
      width: 90%;
    }
    .logo {
      max-width: 180px;
      margin-bottom: 1.5rem;
    }
    .loader {
      border: 5px solid #f3f3f3;
      border-top: 5px solid #3b82f6;
      border-radius: 50%;
      width: 60px;
      height: 60px;
      animation: spin 1.2s linear infinite;
      margin: 1.5rem auto;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    h1 {
      color: #1f2937;
      font-size: 1.8rem;
      margin-bottom: 1rem;
      font-weight: 600;
    }
    p {
      color: #4b5563;
      line-height: 1.6;
      font-size: 1.1rem;
      margin-bottom: 1.5rem;
    }
    .posto-name {
      font-weight: 700;
      color: #3b82f6;
    }
  </style>
</head>
<body>
  <div class="redirect-container">
    <h1>Redirecionando para o Sistema</h1>
    <div class="loader"></div>
    <p>Aguarde enquanto você é redirecionado para a página de login do posto <span class="posto-name">ABC</span>.</p>
  </div>

  <script>
    // Redirecionar após um pequeno delay
    setTimeout(function() {
      window.location.href = "/posto/abc";
    }, 1500);
  </script>
</body>
</html>
