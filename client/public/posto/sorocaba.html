<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Posto Sorocaba - Redirecionamento</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      padding: 20px;
      background-color: #f8f9fa;
      color: #343a40;
      text-align: center;
    }
    
    .container {
      max-width: 500px;
      padding: 30px;
      background-color: white;
      border-radius: 10px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }
    
    h1 {
      margin-bottom: 20px;
      font-size: 24px;
      color: #0f6c43;
    }
    
    p {
      margin-bottom: 20px;
      line-height: 1.5;
    }
    
    .loader {
      border: 4px solid #f3f3f3;
      border-top: 4px solid #0f6c43;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 20px auto;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    .error {
      display: none;
      color: #e74c3c;
      margin-top: 20px;
      padding: 10px;
      border: 1px solid #e74c3c;
      border-radius: 5px;
      background-color: #fde6e6;
    }
    
    button {
      padding: 10px 15px;
      background-color: #0f6c43;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
      margin-top: 10px;
    }
    
    button:hover {
      background-color: #0d5936;
    }
    
    .credentials {
      margin-top: 20px;
      padding: 15px;
      background-color: #e9f7ef;
      border-radius: 5px;
      font-size: 0.9em;
    }
    
    .credentials p {
      margin: 5px 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Posto Sorocaba</h1>
    <p>Você está sendo redirecionado para o sistema de controle do posto...</p>
    <div class="loader"></div>
    <div id="errorMessage" class="error">
      Ocorreu um erro ao redirecionar. Por favor, verifique sua conexão ou tente acessar diretamente:
      <button onclick="redirectNow()">Acessar Agora</button>
    </div>
    
    <div class="credentials">
      <p><strong>Usuário:</strong> sorocaba</p>
      <p><strong>Senha:</strong> murici@2025</p>
    </div>
  </div>

  <script>
    // Informações para redirecionamento
    const postoCode = 'sorocaba';
    const applicationUrl = window.location.protocol + '//' + window.location.host;
    const targetUrl = `${applicationUrl}/posto/${postoCode}`;
    
    // Função para redirecionar
    function redirectNow() {
      window.location.href = targetUrl;
    }
    
    // Mostrar erro após tempo limite
    setTimeout(() => {
      document.getElementById('errorMessage').style.display = 'block';
    }, 5000);
    
    // Redirecionamento automático
    window.onload = function() {
      setTimeout(redirectNow, 1500);
    };
  </script>
</body>
</html>
