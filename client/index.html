<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Murici On Fleet 2.0 - Sistema de Gestão de Frota</title>
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#2563eb" />
    <meta name="description" content="Sistema completo de gestão de frotas com controle de combustível, manutenção e operações" />
    
    <!-- Apple Touch Icon -->
    <link rel="apple-touch-icon" href="/icons/icon-192x192.svg" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Murici Fleet" />
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon-192x192.svg" />
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Windows Tile -->
    <meta name="msapplication-TileColor" content="#2563eb" />
    <meta name="msapplication-TileImage" content="/icons/icon-144x144.svg" />
    <script>
      // FORÇA SOBRESCRITA DAS PROPRIEDADES READONLY DO VITE
      (function() {
        const neutralFunc = function() { return function(type) { return type; }; };
        const neutralReg = function() {};
        
        // DEFINIR ANTES DO VITE CARREGAR
        Object.defineProperty(window, '$RefreshSig$', {
          value: neutralFunc,
          writable: true,
          configurable: true
        });
        Object.defineProperty(window, '$RefreshReg$', {
          value: neutralReg,
          writable: true,
          configurable: true  
        });
        Object.defineProperty(window, '$RefreshRegs$', {
          value: neutralReg,
          writable: true,
          configurable: true
        });
        
        // INTERCEPTAR TENTATIVAS DE REDEFINIÇÃO
        const originalDefine = Object.defineProperty;
        Object.defineProperty = function(obj, prop, descriptor) {
          if (prop === '$RefreshSig$' || prop === '$RefreshReg$' || prop === '$RefreshRegs$') {
            console.log('🚫 BLOCKED Vite attempt to redefine', prop);
            return obj; // BLOQUEAR redefinição do Vite
          }
          return originalDefine.call(this, obj, prop, descriptor);
        };
        
        console.log('🛡️ VITE FAST REFRESH COMPLETAMENTE BLOQUEADO');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- This is a replit script which adds a banner on the top of the page when opened in development mode outside the replit environment -->

  </body>
